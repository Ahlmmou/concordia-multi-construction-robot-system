fleet_mission_controller:
  ros__parameters:
    # Original flexible formation remains the startup behavior (LEGACY).
    # Additional modes are opt-in via /formation/mode_request.
    use_sim_time: true
    rectangle_half_length: 4.2
    rectangle_half_width: 3.4
    compact_half_length: 2.8
    compact_half_width: 2.2
    transition_timeout: 600.0
    trail_lookahead: 2.5
    # Wall point must lie on an occupied map cell; normal points into free space.
    wall_x: 0.0
    wall_y: 0.0
    wall_normal_yaw: 0.0
    wall_probe_distance: 1.0
    maximum_wall_distance: 6.0
    wall_workspace_depth: 3.0
    wall_row_spacing: 1.8
    wall_half_width: 2.2
    maintain_boundary: true
    flexible_boundary: true
    boundary_step: 1.0
    boundary_tolerance: 0.8
    # Map X first, then turn toward the verified line slot.
    single_file_assembly_axis_yaw: 0.0
    single_file_clearance_step: 1.0
    transit_spacing: 3.0
    minimum_separation: 0.4
    # Body-to-body buffer for any auxiliary passing tb1, including in front.
    primary_minimum_separation: 0.6
    footprint_padding: 0.12
    hilti_footprint: "[[-1.20,-0.85],[-1.20,0.85],[1.40,0.85],[1.40,-0.85]]"
    auxiliary_footprint: "[[-0.30,-0.30],[-0.30,0.30],[0.475,0.30],[0.475,-0.30]]"
    leader_speed: 0.60
    auxiliary_speed: 0.80
    angular_speed: 0.50
    # Gentle moving turns reduce the leader's struggle with in-place rotation.
    # In tight spaces, park auxiliaries outward instead of crowding Hilti.
    primary_space_enabled: true
    primary_space_margin: 1.2
    primary_space_probe_padding: 0.6
    primary_space_release_delay: 5.0
    primary_space_search_radius: 3.0
    leader_rolling_turn: true
    rolling_turn_speed: 0.22
    rolling_turn_rate: 0.15
    update_distance: 0.8
    update_angle: 0.5
    minimum_goal_interval: 4.0
    arrival_tolerance: 0.15
    # Auxiliaries may finish within 15 degrees of the requested heading.
    yaw_tolerance: 0.2617993878
    # Finish within 15 cm; Hilti heading within about 3 degrees of the goal arrow.
    primary_yaw_tolerance: 0.05
    alternative_radius: 1.5
    candidate_step: 0.3
    maximum_target_cost: 70
    maximum_follower_lag: 5.0
    collision_horizon: 2.0
    yield_recovery_delay: 3.0
    yield_clearance_distance: 1.5
    obstacle_recovery_delay: 3.0
    obstacle_escape_speed: 0.12
    local_maneuver_search: true
    # Prefer continuous broad reverse arcs before changing gear.
    parking_reverse_distance: 0.65
    parking_turn_rate: 0.15
    # Prefer a completely clear padded slot over an inflated one.
    preferred_slot_cost: 0
    # Bounded checked maneuvers before replanning a blocked Hilti goal.
    primary_maneuver_delay: 0.5
    primary_maneuver_distance: 1.8
    primary_maneuver_angle: 1.2
    primary_maneuver_timeout: 35.0
    # Gain steering room before requesting a fresh formation path.
    obstacle_release_padding: 0.20
    verify_gazebo_localization: true
    maximum_localization_error: 0.35
    action_response_timeout: 30.0
    progress_timeout: 90.0
    maximum_retries: 3
    retry_delay: 8.0
    data_timeout: 15.0
    clock_timeout: 5.0
    command_timeout: 2.0
    lifecycle_timeout: 30.0
    manual_navigation: false
    auto_form_rectangle: false
