fleet_mission_controller:
  ros__parameters:
    use_sim_time: true
    rectangle_half_length: 4.2
    rectangle_half_width: 3.4
    maintain_boundary: true
    flexible_boundary: true
    boundary_step: 1.0
    boundary_tolerance: 0.8
    transit_spacing: 3.0
    minimum_separation: 0.4
    footprint_padding: 0.12
    hilti_footprint: "[[-1.20,-0.85],[-1.20,0.85],[1.40,0.85],[1.40,-0.85]]"
    auxiliary_footprint: "[[-0.30,-0.30],[-0.30,0.30],[0.475,0.30],[0.475,-0.30]]"
    leader_speed: 0.60
    auxiliary_speed: 0.80
    angular_speed: 0.50
    update_distance: 0.8
    update_angle: 0.5
    minimum_goal_interval: 4.0
    arrival_tolerance: 0.4
    yaw_tolerance: 0.45
    alternative_radius: 1.5
    candidate_step: 0.3
    maximum_target_cost: 70
    maximum_follower_lag: 5.0
    collision_horizon: 2.0
    verify_gazebo_localization: true
    maximum_localization_error: 0.35
    action_response_timeout: 30.0
    progress_timeout: 90.0
    maximum_retries: 3
    retry_delay: 8.0
    data_timeout: 15.0
    clock_timeout: 5.0
    command_timeout: 2.0
    lifecycle_timeout: 30.0
    manual_navigation: false
    auto_form_rectangle: false
