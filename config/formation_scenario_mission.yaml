fleet_mission_controller:
  ros__parameters:
    use_sim_time: true
    rectangle_half_length: 4.2
    rectangle_half_width: 3.4
    compact_half_length: 2.8
    compact_half_width: 2.2
    transition_timeout: 600.0
    trail_lookahead: 2.5
    wall_x: 2.0
    wall_y: 12.0
    wall_normal_yaw: -1.5707963267948966
    wall_probe_distance: 1.0
    maximum_wall_distance: 6.0
    wall_workspace_depth: 3.0
    wall_row_spacing: 1.8
    wall_half_width: 2.2
    maintain_boundary: true
    flexible_boundary: true
    boundary_step: 1.0
    boundary_tolerance: 0.8
    # Map X first, then turn toward the verified line slot.
    single_file_assembly_axis_yaw: 0.0
    single_file_clearance_step: 1.0
    transit_spacing: 3.0
    minimum_separation: 0.4
    primary_minimum_separation: 0.6
    footprint_padding: 0.12
    hilti_footprint: '[[-1.20,-0.85],[-1.20,0.85],[1.40,0.85],[1.40,-0.85]]'
    auxiliary_footprint: '[[-0.30,-0.30],[-0.30,0.30],[0.475,0.30],[0.475,-0.30]]'
    leader_speed: 0.6
    auxiliary_speed: 0.8
    angular_speed: 0.5
    leader_rolling_turn: true
    rolling_turn_speed: 0.22
    rolling_turn_rate: 0.15
    update_distance: 0.8
    update_angle: 0.5
    minimum_goal_interval: 4.0
    arrival_tolerance: 0.4
    yaw_tolerance: 0.45
    alternative_radius: 1.5
    candidate_step: 0.3
    maximum_target_cost: 70
    maximum_follower_lag: 5.0
    collision_horizon: 2.0
    yield_recovery_delay: 3.0
    yield_clearance_distance: 1.5
    obstacle_recovery_delay: 3.0
    obstacle_escape_speed: 0.12
    obstacle_release_padding: 0.2
    verify_gazebo_localization: true
    maximum_localization_error: 0.35
    action_response_timeout: 30.0
    progress_timeout: 90.0
    maximum_retries: 3
    retry_delay: 8.0
    data_timeout: 15.0
    clock_timeout: 5.0
    command_timeout: 2.0
    lifecycle_timeout: 30.0
    manual_navigation: false
    auto_form_rectangle: false
